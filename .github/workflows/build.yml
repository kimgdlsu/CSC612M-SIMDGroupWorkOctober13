name: Build and Test SIMD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest # Standard x86_64 Intel/AMD server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NASM
        run: choco install nasm -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Project
        run: msbuild ConsoleApplication1.vcxproj /p:Configuration=Debug /p:Platform=x64

      - name: Run SIMD Benchmark
        run: .\x64\Debug\ConsoleApplication1.exe